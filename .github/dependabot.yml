version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "daily"

  # keep bazel modules in examples up-to-date
  - package-ecosystem: "bazel"
    directory: "examples/*"
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "daily"
