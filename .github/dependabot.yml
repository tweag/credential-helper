version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "daily"

  # keep bazel modules in examples up-to-date
  - package-ecosystem: "bazel"
    directories:
      - "examples/*"
    groups:
      major-by-dependency:
        group-by: dependency-name
        update-types:
          - "major"

      minor-patch-by-dependency:
        group-by: dependency-name
        update-types:
          - "minor"
          - "patch"
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "daily"
