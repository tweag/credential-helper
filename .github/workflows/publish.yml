name: Publish to BCR and finalize release

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      download_default_release_artifacts:
        default: true
        type: boolean
      release_artifacts_run_id:
        description: |
          The GitHub workflow run id to download release artifacts and attestations from when
          `download_default_release_artifacts` is enabled. 
          
          Here (workflow_call), use the id of the current workflow run by default.

          Set the run id manually if not invoking the reusable publish workflow using `workflow_call`
          from the same workflow where the release runs. For example, if running publish in a workflow
          triggered by the release workflow completion (i.e., on: workflow_run: types: ["completed"]), then
          pass `github.event.workflow_run.id`.
        default: ${{ github.run_id }}
        type: string
    secrets:
      publish_token:
        required: true

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Name of the tag to release (e.g. v0.0.9)'
        required: true
        type: string
      download_default_release_artifacts:
        description: |
          Download the release archive and any release attestations uploaded as workflow run artifacts
          by the reusable release_ruleset workflow.

          https://github.com/bazel-contrib/.github/blob/master/.github/workflows/release_ruleset.yaml

          This allows the publish workflow to calculate integrity checksums from the files locally
          rather than attempting to download them from the release.

          This must be enabled when using GitHub immutable releases. Otherwise, artifact downloads using
          release urls will fail since the release has not been finalized.

          If not using the reusable release workflow or the workflow run artifacts cannot be found, this
          will be a no-op and artifacts downloads will fall back to using release urls.
        default: true
        type: boolean
      release_artifacts_run_id:
        description: |
          The GitHub workflow run id to download release artifacts and attestations from when
          `download_default_release_artifacts` is enabled.

          Here (workflow_dispatch), the workflow is being called manually, so the run id of the target 
          release must be provided explicitly.
        required: true
        type: string

jobs:
  # Consume release artifacts to produce a new BCR entry, then attach provided attestations and open a BCR PR.
  publish:
    name: Create BCR entry and PR
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@ca23149e55cd4db07a6bcce69c02dea314c5a357 # v1.5.0
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      registry_fork: tweag/bazel-central-registry
      # We're using the release_ruleset workflow, so enable attestation for the published release.
      # NB: for attestation, the BCR currently will reject attestation not produced with release_ruleset.
      # See: https://github.com/bazel-contrib/publish-to-bcr#attestations
      attest: true
      # Per the publish-to-BCR documentation's section on immutable releases, with attest: true, 
      # the draft: true must be used as well, as "the release must remain as a draft during the publish workflow run".
      # See: https://github.com/bazel-contrib/publish-to-bcr#immutable-releases
      draft: true
      # Artifacts and attestations from the release_ruleset workflow.
      download_default_release_artifacts: ${{ inputs.download_default_release_artifacts }}
      # This should be set to the run id of the workflow that produced the release artifacts.
      release_artifacts_run_id: ${{ inputs.release_artifacts_run_id }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
  
  # Once the publication process is complete, the release on GitHub can (and should) be no longer marked as draft.
  undraft-release:
    name: Undraft GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - run: gh release edit "${{ inputs.tag_name }}" --draft=false --repo "${{ github.repository }}"
