# Create a draft release when triggered via Github's UI or Github CLI
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.0.9)'
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  check_version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - run: |
          if ! [[ '${{ inputs.version }}' =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
             echo '${{ inputs.version }} does not match expected format `major.minor.patch`' >&2
             exit 1
           fi
  release:
    name: Prepare Release
    needs: check_version
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: v${{ inputs.version }}
      # Support GitHub immutable releases.
      draft: true
      prerelease: false
      release_files: dist/**/*
  publish:
    name: Make draft release
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: v${{ inputs.version }}
      release_artifacts_run_id: ${{ github.run_id }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
