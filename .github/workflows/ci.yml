name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Every day at 10:09 UTC.
    - cron: '9 10 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buildifier_check:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Bazel
      uses: cgrindel/gha_set_up_bazel@1d90e265a42a5a0eb50b7fb1781e7bf3154e3aed # v2.0.22
      with:
        repo_name: credential-helper
    - name: Run buildifier
      run: bazelisk run //util:buildifier.check
  tidy_and_test_matrix:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
    - name: Execute Tests
      run: bazelisk test //...
  integration_test_matrix:
    # skip integration tests for fork PRs (secrets won't be available)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::381492153904:role/git-s3-access
        aws-region: us-east-1
    - name: Authenticate with GCP
      id: gauth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: "projects/341646648187/locations/global/workloadIdentityPools/github-workload-pool/providers/github-provider"
        service_account: "github-service-account@git-credential-helper-dev.iam.gserviceaccount.com"
        export_environment_variables: true
        create_credentials_file: true
    - name: Setup Bazel
      uses: cgrindel/gha_set_up_bazel@1d90e265a42a5a0eb50b7fb1781e7bf3154e3aed # v2.0.22
      with:
        repo_name: credential-helper
    - name: Generate GitHub token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ secrets.TWEAG_CREDENTIALS_HELPER_CI_APP_CLIENT_ID }}
        private-key: ${{ secrets.TWEAG_CREDENTIALS_HELPER_CI_APP_KEY }}
        repositories: credential-helper-private
    - name: Execute Integration Tests
      run: bazelisk test "//examples:integration_tests"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  all_ci_tests:
    name: Required CI
    if: ${{ always() && !cancelled() }}
    needs: [buildifier_check, tidy_and_test_matrix, integration_test_matrix]
    runs-on: ubuntu-slim
    steps:
      - name: Fail if a dependency failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
